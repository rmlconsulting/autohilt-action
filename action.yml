# autoHILT — run hardware tests from a GitHub Actions build (2026-10-11,
# BACKLOG 95). One step: the build says what to test the way a person would
# in Slack, the server picks the hardware (production stations only — the
# CI token never reaches a dev machine), the run waits its turn behind a
# reservation or a running test, and the step ends with the verdict: the job
# fails on a failed test, the summary tab carries the table, and the outputs
# below carry the facts. The engine's `autohilt run` is what runs — the same
# verb from a terminal — so there is ONE client of the batch doors.
#
#   - uses: rmlconsulting/autohilt-action@v1
#     with:
#       run: smoke on 2 units
#       token: ${{ secrets.AUTOHILT_TOKEN }}
#
# A test admin mints the token on Admin -> CI access and stores it as the
# repository secret; it belongs to the company, so it outlives any one
# person's membership.
name: autoHILT run
description: Run hardware tests on your autoHILT fleet and wait for the verdict
branding:
  icon: cpu
  color: green
inputs:
  run:
    description: 'What to run, as you would say it: "smoke on 2 units", "product:widget on all", "-k uart on station-004"'
    required: true
  token:
    description: The company CI token (AUTOHILT_TOKEN repository secret, minted on Admin -> CI access)
    required: true
  ref:
    description: The commit to test; the build's commit by default
    required: false
    default: ${{ github.sha }}
  server:
    description: Your autoHILT server
    required: false
    default: https://autohilt.com
  timeout:
    description: How long to wait for the verdict (90s, 10m, 1h). Empty = as long as the run may take — the profile's timeout + grace + 5 min (engine 0.10.0+), or 60m for a request with no profile
    required: false
    default: ""
  max_wait:
    description: How long the runs may wait in autoHILT's queue for a unit before they end (2h, 30 minutes, 1d). Empty = on a GitHub-hosted runner, what its 6 h job has left after the profile's allowable time (a profile that cannot fit is refused at once); on a self-hosted runner, autoHILT's default (24 h)
    required: false
    default: ""
  cancel_on_timeout:
    description: At the bound, cancel the request — what has not started never starts, and a run already on a machine stops cleanly, keeping the tests that finished (true); or leave the runs queued (false)
    required: false
    default: "true"
  engine:
    description: Which engine to run — a PyPI requirement (the default asks for an engine that has `autohilt run`) or a path to a wheel
    required: false
    default: autohilt>=0.10.1
outputs:
  batch_id:
    description: The batch the request became
    value: ${{ steps.run.outputs.batch_id }}
  verdict:
    description: passed | failed | empty (no tests matched — the job passes with a warning) | unrunnable | canceled | timeout | interrupted
    value: ${{ steps.run.outputs.verdict }}
  passed:
    description: Runs that passed
    value: ${{ steps.run.outputs.passed }}
  failed:
    description: Runs that failed
    value: ${{ steps.run.outputs.failed }}
  url:
    description: The Runs page
    value: ${{ steps.run.outputs.url }}
runs:
  using: composite
  steps:
    - name: uv (the engine's toolchain)
      uses: astral-sh/setup-uv@v6
    - name: autohilt run
      id: run
      shell: bash
      env:
        AUTOHILT_CI_TOKEN: ${{ inputs.token }}
        AUTOHILT_SERVER: ${{ inputs.server }}
        AH_RUN_REQUEST: ${{ inputs.run }}
        AH_RUN_REF: ${{ inputs.ref }}
        AH_RUN_TIMEOUT: ${{ inputs.timeout }}
        AH_RUN_CANCEL: ${{ inputs.cancel_on_timeout }}
        AH_RUN_ENGINE: ${{ inputs.engine }}
        AH_RUN_MAX_WAIT: ${{ inputs.max_wait }}
        AH_RUNNER_ENV: ${{ runner.environment }}
      run: |
        set -u
        policy=--cancel-on-timeout
        case "$AH_RUN_CANCEL" in false|False|FALSE|0|no) policy=--no-cancel-on-timeout;; esac
        # the request is one argument (never re-split by the shell); the
        # engine comes from PyPI by requirement, or a wheel by path
        # the wait is named only when the workflow named it; otherwise the
        # engine waits as long as the profile allows (0.10.0)
        # the queue's maximum wait rides the request's own sentence (the run
        # grammar's `max wait` clause), so no engine change carries it: the
        # workflow's own, or on a GitHub-hosted runner what its 6 h job has
        # left, which the server works out from the profile
        request=$AH_RUN_REQUEST
        if [ -n "$AH_RUN_MAX_WAIT" ]; then
          request="$request max wait $AH_RUN_MAX_WAIT"
        elif [ "$AH_RUNNER_ENV" = github-hosted ]; then
          request="$request max wait github-hosted"
        fi
        set -- --ref "$AH_RUN_REF" "$policy"
        [ -n "$AH_RUN_TIMEOUT" ] && set -- "$@" --timeout "$AH_RUN_TIMEOUT"
        uvx --from "$AH_RUN_ENGINE" autohilt run "$request" "$@"
